services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: arcana
      POSTGRES_USER: arcana
      POSTGRES_PASSWORD: arcana
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcana -d arcana"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://arcana:arcana@db:5432/arcana
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
