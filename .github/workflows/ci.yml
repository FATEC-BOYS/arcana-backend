name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: arcana_test
          POSTGRES_USER: arcana
          POSTGRES_PASSWORD: arcana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arcana -d arcana_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KERYKEION_BACKEND: swisseph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m scripts.bootstrap
        env:
          DATABASE_URL: postgresql+psycopg://arcana:arcana@localhost:5432/arcana_test
      - run: python -m scripts.evaluate
        env:
          DATABASE_URL: postgresql+psycopg://arcana:arcana@localhost:5432/arcana_test
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://arcana:arcana@localhost:5432/arcana_test
